name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build, for example v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mlugg/setup-zig asks for zig-linux-x86_64-VERSION. Zig 0.16 renamed its
      # archives to zig-x86_64-linux-VERSION, so every mirror returns 404.
      # Fetching from ziglang.org directly avoids the whole problem.
      - name: Install Zig
        run: |
          set -euo pipefail
          v=0.16.0
          url="https://ziglang.org/download/$v/zig-x86_64-linux-$v.tar.xz"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - run: zig version

      - name: Test
        run: zig build test --summary all

      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Zig cross-compiles every target from one machine, so there is no build
      # matrix and no cross toolchain to install.
      - name: Build all targets
        run: ./scripts/build-release.sh "${{ steps.v.outputs.version }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
